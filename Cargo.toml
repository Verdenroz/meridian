[package]
name = "meridian"
version = "0.2.0"
edition = "2024"

# Live poller only (spec §3.5): quotes, intraday bars, and feed polling during
# market hours for daily decision inputs and break-glass monitoring (§4.5).
# The former training-corpus builder lives, reference-only, in legacy/databus-v4/.

[lib]
name = "meridian"

[[bin]]
name = "meridian-bus"
path = "src/main.rs"

[dependencies]
finance-query = { version = "=2.6.1" }
tokio         = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
reqwest       = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1.0"
anyhow        = "1.0"
chrono        = { version = "0.4", features = ["serde"] }
clap          = { version = "4", features = ["derive"] }
tracing       = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
