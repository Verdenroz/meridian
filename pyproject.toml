[build-system]
requires = ["maturin>=1.7"]
build-backend = "maturin"

[project]
name = "meridian-training"
version = "0.1.0"
description = "Pre-training and data setup foundation for the Meridian architecture."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
train = [
  "torch>=2.3",
  "numpy>=2.1",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "hmmlearn>=0.3",
  "faiss-cpu>=1.8",
  "tokenizers>=0.20",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
meridian = "cli:main"

[tool.maturin]
python-source = "python"
module-name = "meridian_py"
features = ["pyo3/extension-module"]

