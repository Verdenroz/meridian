name: Score archived headline tone

on:
  schedule:
    # Daily, after the last archive sweeps of the UTC day matter least;
    # scoring is incremental and idempotent so cadence only bounds lag.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: score-tone
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scorer deps (CPU torch)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install transformers

      - name: Score new whitelisted headlines
        env:
          PYTHONPATH: python
        run: python -m tone_live score

      - name: Commit and push
        run: |
          git config user.name "tone-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/tone_live
          if git diff --cached --quiet; then
            echo "no new scores"
            exit 0
          fi
          git commit -m "chore: tone-live scores $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase && git push)
