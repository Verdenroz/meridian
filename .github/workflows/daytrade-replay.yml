name: Day-trade forward replay

on:
  schedule:
    # After archive-bars (21:40) has committed the session's 1m bars.
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daytrade-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install environment
        run: uv sync --frozen

      - name: Replay newly archived sessions
        env:
          PYTHONPATH: python
        run: uv run python -m daytrade replay

      - name: Commit and push
        run: |
          git config user.name "daytrade-replay-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/execution/daytrade
          if git diff --cached --quiet; then
            echo "no new sessions"
            exit 0
          fi
          git commit -m "chore: daytrade replay $(date -u +%Y-%m-%d)"
          # Retry once on race with a concurrent push
          git push || (git pull --rebase && git push)
