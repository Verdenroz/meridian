name: Evidence-clock watchdog

on:
  schedule:
    # 15:15 UTC weekdays: after both paper-trade slots, well after the
    # previous evening's shadow run
    - cron: "15 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install environment
        run: uv sync --frozen

      - name: Check last session was logged
        env:
          PYTHONPATH: python
          MERIDIAN_ALERT_WEBHOOK: ${{ secrets.MERIDIAN_ALERT_WEBHOOK }}
        run: uv run python -m execution watchdog
